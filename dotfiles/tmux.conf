# Catppuccin Mocha 색상의 tmux 설정(terminal-setup.sh 가 ~/.tmux.conf 로 복사한다)
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind S setw synchronize-panes \; display "sync #{?synchronize-panes,ON,OFF}"

set -g status-style "bg=#313244,fg=#CDD6F4"
set -g status-left-length 30
set -g status-left "#[bg=#89B4FA,fg=#1E1E2E,bold] #S #[default] "
set -g status-right "#{?synchronize-panes,#[bg=#F38BA8#,fg=#1E1E2E#,bold] SYNC ON #[default] ,}#[fg=#B4BEFE]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#B4BEFE,fg=#1E1E2E,bold"
set -g message-style "bg=#F9E2AF,fg=#1E1E2E"

set -g pane-border-style "#{?synchronize-panes,fg=#F38BA8,fg=#585B70}"
set -g pane-active-border-style "#{?synchronize-panes,fg=#F38BA8,fg=#89B4FA}"
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} #{?synchronize-panes,#[fg=#F38BA8#,bold]SYNC ,}"
